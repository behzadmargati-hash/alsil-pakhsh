<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14532d"><title>الوین پخش</title>
<style>
:root{--green:#166534;--green2:#15803d;--bg:#f3f6f4;--card:#fff;--text:#17221b;--muted:#65736a;--line:#dce5de;--red:#b91c1c;--orange:#b45309;--blue:#1d4ed8}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}header{background:linear-gradient(135deg,#14532d,#15803d);color:#fff;padding:18px 14px 14px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0002}header h1{font-size:22px;margin:0 0 6px}header p{margin:0;font-size:12px;opacity:.9}.wrap{max-width:1100px;margin:auto;padding:12px}.tabs{display:flex;gap:6px;overflow:auto;padding:8px 0 12px;position:sticky;top:80px;background:var(--bg);z-index:4}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#23402d;border-radius:10px;padding:10px 12px;font-weight:bold}.tabs button.active{background:var(--green);color:#fff;border-color:var(--green)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 5px #12200f05}.metric small{color:var(--muted);display:block;margin-bottom:8px}.metric strong{font-size:21px;display:block;overflow-wrap:anywhere}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 12px}.section-title h2{font-size:18px;margin:0}.hidden{display:none!important}label{display:block;font-size:12px;color:var(--muted);margin:8px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd8ce;border-radius:9px;background:#fff;font:inherit;min-height:42px;color:var(--text)}textarea{min-height:70px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.btn{border:0;border-radius:9px;padding:10px 13px;font:inherit;font-weight:bold;cursor:pointer;background:var(--green);color:white}.btn.secondary{background:#e5eee7;color:#164e2a}.btn.danger{background:#fee2e2;color:#991b1b}.btn.warn{background:#fef3c7;color:#92400e}.btn.blue{background:#dbeafe;color:#1e40af}.btnrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:550px}th,td{text-align:right;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted);background:#f8faf8}td .btn{padding:6px 8px;font-size:12px;margin:2px}.muted{color:var(--muted);font-size:12px}.pill{display:inline-block;border-radius:20px;padding:4px 8px;font-size:11px;background:#e5eee7;color:#14532d}.pill.red{background:#fee2e2;color:#991b1b}.pill.orange{background:#fef3c7;color:#92400e}.empty{text-align:center;color:var(--muted);padding:24px}.notice{padding:10px 12px;border-radius:10px;background:#eff6ff;color:#1e40af;line-height:1.8;margin-bottom:12px}.danger-note{background:#fff7ed;color:#9a3412}.footer{text-align:center;color:var(--muted);font-size:11px;padding:20px}.search{margin-bottom:10px}.totalbox{background:#f0fdf4;border:1px solid #bbf7d0;padding:12px;border-radius:10px;font-weight:bold}.dashlinks{display:flex;gap:7px;flex-wrap:wrap}.dashlinks button{flex:1;min-width:100px}.small{font-size:11px}.modalback{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}.modal{background:white;border-radius:14px;padding:16px;width:min(600px,100%);max-height:90vh;overflow:auto}.modal h3{margin-top:0}@media(min-width:760px){header{padding-right:max(18px,calc((100% - 1080px)/2));padding-left:max(18px,calc((100% - 1080px)/2))}.tabs{top:74px}}
</style></head>
<body>
<header><h1>الوین پخش</h1><p>مدیریت فروش، انبار، خرید، تأمین‌کننده، چک، مرجوعی و پخش</p></header>
<div class="wrap"><nav class="tabs" id="tabs"></nav><main id="app"></main><div class="footer">اطلاعات روی همین گوشی و همین مرورگر ذخیره می‌شود؛ مرتب نسخه پشتیبان بگیرید.</div></div>
<div id="modalroot"></div>
<script>
const $=s=>document.querySelector(s); const money=n=>(Number(n)||0).toLocaleString('fa-IR')+' تومان'; const num=n=>Number(n)||0; const today=()=>new Date().toISOString().slice(0,10); const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const emptyDB=()=>({products:[],customers:[],sales:[],payments:[],expenses:[],suppliers:[],purchases:[],supplierPayments:[],checks:[],returns:[],deliveries:[],settings:{business:'الوین پخش',phone:'',address:''}});
let db;try{db=JSON.parse(localStorage.getItem('alvinPakhshDB')||'null')||emptyDB()}catch(e){db=emptyDB()} for(const k of ['products','customers','sales','payments','expenses','suppliers','purchases','supplierPayments','checks','returns','deliveries'])if(!Array.isArray(db[k]))db[k]=[];if(!db.settings)db.settings={business:'الوین پخش',phone:'',address:''};
let page='home', searchText=''; function save(){localStorage.setItem('alvinPakhshDB',JSON.stringify(db));}
const nav=[['home','خانه'],['products','کالاها'],['customers','مشتریان'],['sales','فروش'],['payments','دریافت پول'],['suppliers','تأمین‌کنندگان'],['purchases','خرید و ورود انبار'],['supplierpay','پرداخت به تأمین‌کننده'],['checks','چک‌ها'],['returns','مرجوعی'],['deliveries','ارسال و پخش'],['expenses','هزینه‌ها'],['reports','گزارش‌ها'],['backup','پشتیبان']];
function render(){ $('#tabs').innerHTML=nav.map(([id,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${t}</button>`).join(''); const fn={home:homePage,products:productsPage,customers:customersPage,sales:salesPage,payments:paymentsPage,suppliers:suppliersPage,purchases:purchasesPage,supplierpay:supplierPayPage,checks:checksPage,returns:returnsPage,deliveries:deliveriesPage,expenses:expensesPage,reports:reportsPage,backup:backupPage}; $('#app').innerHTML=fn[page](); }
function go(p){page=p;searchText='';render();window.scrollTo(0,0)}
function sumSales(){return db.sales.reduce((a,s)=>a+num(s.total),0)} function sumCollected(){return db.sales.reduce((a,s)=>a+num(s.paid),0)+db.payments.reduce((a,p)=>a+num(p.amount),0)} function customerBalance(id){return db.sales.filter(s=>s.customerId===id).reduce((a,s)=>a+num(s.total)-num(s.paid),0)-db.payments.filter(p=>p.customerId===id).reduce((a,p)=>a+num(p.amount),0)} function totalDebt(){return db.customers.reduce((a,c)=>a+Math.max(0,customerBalance(c.id)),0)} function stockValue(){return db.products.reduce((a,p)=>a+num(p.qty)*num(p.cost),0)} function productName(id){return db.products.find(p=>p.id===id)?.name||'کالای حذف‌شده'} function customerName(id){return db.customers.find(c=>c.id===id)?.name||'مشتری متفرقه'}
function homePage(){let low=db.products.filter(p=>num(p.qty)<=num(p.minQty));let recent=[...db.sales].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);return `<div class="grid"><div class="card metric"><small>فروش ثبت‌شده</small><strong>${money(sumSales())}</strong></div><div class="card metric"><small>مانده بدهی مشتریان</small><strong>${money(totalDebt())}</strong></div><div class="card metric"><small>ارزش خرید موجودی</small><strong>${money(stockValue())}</strong></div><div class="card metric"><small>تعداد کالاها</small><strong>${db.products.length.toLocaleString('fa-IR')}</strong></div></div><div class="card"><div class="section-title"><h2>دسترسی سریع</h2></div><div class="dashlinks"><button class="btn" onclick="go('sales')">ثبت فروش</button><button class="btn secondary" onclick="go('payments')">دریافت از مشتری</button><button class="btn secondary" onclick="go('products')">ثبت کالا</button><button class="btn secondary" onclick="go('customers')">ثبت مشتری</button></div></div><div class="card"><div class="section-title"><h2>هشدار موجودی کم</h2><span class="pill ${low.length?'red':''}">${low.length.toLocaleString('fa-IR')} کالا</span></div>${low.length?`<div class="tablewrap"><table><thead><tr><th>کالا</th><th>موجودی</th><th>حد هشدار</th></tr></thead><tbody>${low.map(p=>`<tr><td>${esc(p.name)}</td><td><span class="pill red">${num(p.qty).toLocaleString('fa-IR')} ${esc(p.unit||'عدد')}</span></td><td>${num(p.minQty).toLocaleString('fa-IR')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">فعلاً کالایی زیر حد هشدار نیست.</div>'}</div><div class="card"><div class="section-title"><h2>آخرین فروش‌ها</h2><button class="btn secondary" onclick="go('sales')">همه فروش‌ها</button></div>${recent.length?`<div class="tablewrap"><table><thead><tr><th>تاریخ</th><th>مشتری</th><th>مبلغ</th><th>مانده</th></tr></thead><tbody>${recent.map(s=>`<tr><td>${esc(s.date)}</td><td>${esc(customerName(s.customerId))}</td><td>${money(s.total)}</td><td>${money(Math.max(0,num(s.total)-num(s.paid)))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">هنوز فروشی ثبت نشده است.</div>'}</div>`}
function productsPage(){return `<div class="card"><div class="section-title"><h2>ثبت / ویرایش کالا</h2></div><form id="productForm" onsubmit="saveProduct(event)"><input type="hidden" id="pId"><div class="formgrid"><div><label>نام کالا *</label><input id="pName" required placeholder="مثلاً مایع ظرفشویی پریل"></div><div><label>کد کالا (اختیاری)</label><input id="pCode" placeholder="کد یا بارکد"></div><div><label>دسته‌بندی</label><input id="pCat" placeholder="مثلاً شوینده"></div><div><label>واحد</label><select id="pUnit"><option>عدد</option><option>کارتن</option><option>بسته</option><option>کیلوگرم</option><option>لیتر</option><option>گالن</option></select></div><div><label>قیمت خرید (تومان)</label><input id="pCost" type="number" min="0" value="0"></div><div><label>قیمت فروش (تومان)</label><input id="pPrice" type="number" min="0" value="0" required></div><div><label>موجودی فعلی</label><input id="pQty" type="number" min="0" step="0.01" value="0"></div><div><label>هشدار موجودی در این عدد</label><input id="pMin" type="number" min="0" step="0.01" value="5"></div></div><div class="btnrow"><button class="btn" type="submit">ذخیره کالا</button><button class="btn secondary" type="button" onclick="resetProduct()">پاک‌کردن فرم</button></div></form></div><div class="card"><div class="section-title"><h2>فهرست کالاها</h2><span class="pill">${db.products.length.toLocaleString('fa-IR')} کالا</span></div><input class="search" placeholder="جست‌وجوی نام، کد یا دسته‌بندی" oninput="searchText=this.value;document.querySelector('#productRows').innerHTML=productRows()"><div class="tablewrap"><table><thead><tr><th>کالا</th><th>موجودی</th><th>خرید</th><th>فروش</th><th>عملیات</th></tr></thead><tbody id="productRows">${productRows()}</tbody></table></div></div>`}
function productRows(){let list=db.products.filter(p=>(p.name+' '+p.code+' '+p.cat).toLowerCase().includes(searchText.toLowerCase()));return list.length?list.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="muted">${esc(p.code||'بدون کد')} · ${esc(p.cat||'بدون دسته')}</div></td><td><span class="pill ${num(p.qty)<=num(p.minQty)?'red':''}">${num(p.qty).toLocaleString('fa-IR')} ${esc(p.unit||'عدد')}</span></td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td><button class="btn secondary" onclick="editProduct('${p.id}')">ویرایش</button><button class="btn danger" onclick="deleteProduct('${p.id}')">حذف</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">کالایی پیدا نشد.</td></tr>'}
function saveProduct(e){e.preventDefault();let id=$('#pId').value;let x={id:id||uid(),name:$('#pName').value.trim(),code:$('#pCode').value.trim(),cat:$('#pCat').value.trim(),unit:$('#pUnit').value,cost:num($('#pCost').value),price:num($('#pPrice').value),qty:num($('#pQty').value),minQty:num($('#pMin').value)};if(id)db.products=db.products.map(p=>p.id===id?x:p);else db.products.push(x);save();render();}
function editProduct(id){let p=db.products.find(x=>x.id===id);if(!p)return;$('#pId').value=p.id;$('#pName').value=p.name;$('#pCode').value=p.code||'';$('#pCat').value=p.cat||'';$('#pUnit').value=p.unit||'عدد';$('#pCost').value=p.cost||0;$('#pPrice').value=p.price||0;$('#pQty').value=p.qty||0;$('#pMin').value=p.minQty||0;window.scrollTo(0,0)}function resetProduct(){ $('#productForm').reset();$('#pId').value='';$('#pCost').value=0;$('#pPrice').value=0;$('#pQty').value=0;$('#pMin').value=5; }function deleteProduct(id){if(confirm('این کالا حذف شود؟')){db.products=db.products.filter(p=>p.id!==id);save();render()}}
function customersPage(){return `<div class="card"><div class="section-title"><h2>ثبت / ویرایش مشتری</h2></div><form id="customerForm" onsubmit="saveCustomer(event)"><input type="hidden" id="cId"><div class="formgrid"><div><label>نام مشتری *</label><input id="cName" required></div><div><label>شماره تماس</label><input id="cPhone" inputmode="tel"></div><div><label>آدرس</label><input id="cAddress"></div><div><label>یادداشت</label><input id="cNote" placeholder="مثلاً سوپرمارکت"></div></div><div class="btnrow"><button class="btn">ذخیره مشتری</button><button class="btn secondary" type="button" onclick="resetCustomer()">فرم جدید</button></div></form></div><div class="card"><div class="section-title"><h2>مشتریان و بدهی</h2><span class="pill">${db.customers.length.toLocaleString('fa-IR')} مشتری</span></div><input class="search" placeholder="جست‌وجوی نام یا شماره" oninput="searchText=this.value;$('#customerRows').innerHTML=customerRows()"><div class="tablewrap"><table><thead><tr><th>مشتری</th><th>تماس</th><th>مانده بدهی</th><th>عملیات</th></tr></thead><tbody id="customerRows">${customerRows()}</tbody></table></div></div>`}
function customerRows(){let list=db.customers.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(searchText.toLowerCase()));return list.length?list.map(c=>`<tr><td><b>${esc(c.name)}</b><div class="muted">${esc(c.address||'')} ${c.note?'· '+esc(c.note):''}</div></td><td>${esc(c.phone||'—')}</td><td><span class="pill ${customerBalance(c.id)>0?'red':''}">${money(customerBalance(c.id))}</span></td><td><button class="btn secondary" onclick="editCustomer('${c.id}')">ویرایش</button><button class="btn blue" onclick="quickPay('${c.id}')">دریافت</button><button class="btn danger" onclick="deleteCustomer('${c.id}')">حذف</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty">مشتری پیدا نشد.</td></tr>'}
function saveCustomer(e){e.preventDefault();let id=$('#cId').value,x={id:id||uid(),name:$('#cName').value.trim(),phone:$('#cPhone').value.trim(),address:$('#cAddress').value.trim(),note:$('#cNote').value.trim()};if(id)db.customers=db.customers.map(c=>c.id===id?x:c);else db.customers.push(x);save();render()}function editCustomer(id){let c=db.customers.find(x=>x.id===id);if(!c)return;$('#cId').value=c.id;$('#cName').value=c.name;$('#cPhone').value=c.phone||'';$('#cAddress').value=c.address||'';$('#cNote').value=c.note||'';window.scrollTo(0,0)}function resetCustomer(){$('#customerForm').reset();$('#cId').value=''}function deleteCustomer(id){if(db.sales.some(s=>s.customerId===id)||db.payments.some(p=>p.customerId===id)){alert('برای این مشتری سابقه مالی ثبت شده؛ برای حفظ حساب‌ها حذف نمی‌شود.');return}if(confirm('مشتری حذف شود؟')){db.customers=db.customers.filter(c=>c.id!==id);save();render()}}
function salesPage(){return `<div class="card"><div class="section-title"><h2>ثبت فروش / فاکتور</h2></div><div class="notice">برای هر فاکتور فعلاً یک نوع کالا ثبت می‌شود. اگر چند قلم فروخته‌ای، هر قلم را جدا ثبت کن و شماره فاکتور یکسان بگذار.</div><form id="saleForm" onsubmit="saveSale(event)"><div class="formgrid"><div><label>تاریخ</label><input id="sDate" type="date" value="${today()}" required></div><div><label>شماره فاکتور</label><input id="sInvoice" placeholder="خالی بگذاری خودکار ساخته می‌شود"></div><div><label>مشتری</label><select id="sCustomer"><option value="">مشتری متفرقه / نقدی</option>${db.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div><label>کالا *</label><select id="sProduct" required onchange="saleProductChanged()"><option value="">انتخاب کالا</option>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} (موجودی: ${num(p.qty)} ${esc(p.unit||'عدد')})</option>`).join('')}</select></div><div><label>تعداد / مقدار</label><input id="sQty" type="number" min="0.01" step="0.01" value="1" required oninput="updateSalePreview()"></div><div><label>قیمت فروش هر واحد (تومان)</label><input id="sPrice" type="number" min="0" value="0" required oninput="updateSalePreview()"></div><div><label>تخفیف کل (تومان)</label><input id="sDiscount" type="number" min="0" value="0" oninput="updateSalePreview()"></div><div><label>مبلغ دریافتی همین لحظه</label><input id="sPaid" type="number" min="0" value="0" required oninput="updateSalePreview()"></div><div><label>روش دریافت</label><select id="sMethod"><option>نقدی</option><option>کارت‌خوان</option><option>کارت‌به‌کارت</option><option>چک</option><option>ترکیبی</option></select></div><div><label>توضیحات</label><input id="sNote" placeholder="اختیاری"></div></div><div class="totalbox" id="salePreview">مبلغ نهایی: ۰ تومان</div><div class="btnrow"><button class="btn">ثبت فروش</button><button class="btn secondary" type="button" onclick="resetSale()">پاک‌کردن فرم</button></div></form></div><div class="card"><div class="section-title"><h2>فاکتورهای ثبت‌شده</h2></div><input class="search" placeholder="جست‌وجو بر اساس شماره، مشتری یا کالا" oninput="searchText=this.value;$('#saleRows').innerHTML=saleRows()"><div class="tablewrap"><table><thead><tr><th>فاکتور / تاریخ</th><th>مشتری و کالا</th><th>کل فاکتور</th><th>دریافتی</th><th>مانده</th><th>عملیات</th></tr></thead><tbody id="saleRows">${saleRows()}</tbody></table></div></div>`}
function saleProductChanged(){let p=db.products.find(p=>p.id===$('#sProduct')?.value);if(p&&$('#sPrice')){$('#sPrice').value=p.price;$('#sPrice').dataset.edited='';}updateSalePreview()} function updateSalePreview(){let total=Math.max(0,num($('#sQty')?.value)*num($('#sPrice')?.value)-num($('#sDiscount')?.value));let paid=num($('#sPaid')?.value);if($('#salePreview'))$('#salePreview').innerHTML=`مبلغ نهایی: ${money(total)} · مانده: ${money(Math.max(0,total-paid))}`;}
function saveSale(e){e.preventDefault();let p=db.products.find(p=>p.id===$('#sProduct').value);if(!p){alert('اول کالا را انتخاب کن.');return}let qty=num($('#sQty').value);if(qty>num(p.qty)){if(!confirm('موجودی ثبت‌شده کمتر از مقدار فروش است. با این حال ثبت شود؟'))return}let total=Math.max(0,qty*num($('#sPrice').value)-num($('#sDiscount').value)),paid=num($('#sPaid').value);if(paid>total){alert('مبلغ دریافتی نمی‌تواند از مبلغ فاکتور بیشتر باشد.');return}let s={id:uid(),invoice:$('#sInvoice').value.trim()||('AV-'+Date.now().toString().slice(-7)),date:$('#sDate').value,customerId:$('#sCustomer').value,productId:p.id,qty,price:num($('#sPrice').value),discount:num($('#sDiscount').value),total,paid,method:$('#sMethod').value,note:$('#sNote').value.trim()};p.qty=num(p.qty)-qty;db.sales.push(s);save();render();alert('فروش ثبت شد. برای چاپ فاکتور از دکمه چاپ استفاده کن.')}
function saleRows(){let list=[...db.sales].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).filter(s=>(s.invoice+' '+customerName(s.customerId)+' '+productName(s.productId)).toLowerCase().includes(searchText.toLowerCase()));return list.length?list.map(s=>`<tr><td><b>${esc(s.invoice)}</b><div class="muted">${esc(s.date)}</div></td><td>${esc(customerName(s.customerId))}<div class="muted">${esc(productName(s.productId))} × ${num(s.qty).toLocaleString('fa-IR')}</div></td><td>${money(s.total)}</td><td>${money(s.paid)}</td><td><span class="pill ${s.total>s.paid?'red':''}">${money(Math.max(0,s.total-s.paid))}</span></td><td><button class="btn secondary" onclick="printInvoice('${s.id}')">چاپ</button><button class="btn danger" onclick="deleteSale('${s.id}')">حذف/برگشت</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">فاکتوری ثبت نشده است.</td></tr>'}
function resetSale(){ $('#saleForm').reset();$('#sDate').value=today();$('#sQty').value=1;$('#sDiscount').value=0;$('#sPaid').value=0;$('#sPrice').dataset.edited='';$('#sInvoice').value='';updateSalePreview()}document.addEventListener('input',e=>{if(e.target&&e.target.id==='sPrice')e.target.dataset.edited='1'});
function deleteSale(id){let s=db.sales.find(s=>s.id===id);if(!s)return;if(!confirm('این فاکتور حذف شود و موجودی کالا به قبل برگردد؟ اگر بعداً دریافت جداگانه ثبت کرده‌ای، حساب مشتری را هم بررسی کن.'))return;let p=db.products.find(p=>p.id===s.productId);if(p)p.qty=num(p.qty)+num(s.qty);db.sales=db.sales.filter(x=>x.id!==id);save();render()}
function printInvoice(id){let s=db.sales.find(x=>x.id===id);if(!s)return;let c=db.customers.find(x=>x.id===s.customerId)||{};let w=window.open('','_blank');if(!w){alert('مرورگر اجازه بازشدن صفحه چاپ را نداده؛ اجازه پنجره بازشو را فعال کن.');return}w.document.write(`<html lang="fa" dir="rtl"><meta charset="utf-8"><title>فاکتور ${esc(s.invoice)}</title><style>body{font-family:Tahoma,Arial;padding:25px}h2{text-align:center}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{border:1px solid #aaa;padding:10px;text-align:right}.total{margin-top:20px;font-weight:bold}</style><h2>${esc(db.settings.business||'الوین پخش')}</h2><p>شماره فاکتور: ${esc(s.invoice)} | تاریخ: ${esc(s.date)}</p><p>مشتری: ${esc(c.name||'مشتری متفرقه')} | تماس: ${esc(c.phone||'—')}</p><table><tr><th>شرح کالا</th><th>تعداد</th><th>قیمت واحد</th><th>تخفیف</th><th>مبلغ نهایی</th></tr><tr><td>${esc(productName(s.productId))}</td><td>${num(s.qty)}</td><td>${money(s.price)}</td><td>${money(s.discount)}</td><td>${money(s.total)}</td></tr></table><p class="total">دریافت‌شده: ${money(s.paid)} | مانده: ${money(Math.max(0,s.total-s.paid))}</p><p>روش دریافت: ${esc(s.method||'—')}</p><p>توضیحات: ${esc(s.note||'—')}</p><p style="margin-top:50px">امضای فروشنده: ....................　 امضای مشتری: ....................</p><script>window.onload=()=>window.print()<\/script></html>`);w.document.close()}
function paymentsPage(){return `<div class="card"><div class="section-title"><h2>ثبت دریافت از مشتری</h2></div><form onsubmit="savePayment(event)"><div class="formgrid"><div><label>تاریخ</label><input id="payDate" type="date" value="${today()}" required></div><div><label>مشتری *</label><select id="payCustomer" required><option value="">انتخاب مشتری</option>${db.customers.map(c=>`<option value="${c.id}">${esc(c.name)} — مانده ${money(customerBalance(c.id))}</option>`).join('')}</select></div><div><label>مبلغ دریافت (تومان)</label><input id="payAmount" type="number" min="1" required></div><div><label>روش دریافت</label><select id="payMethod"><option>نقدی</option><option>کارت‌خوان</option><option>کارت‌به‌کارت</option><option>چک</option><option>ترکیبی</option></select></div><div><label>شماره رسید / توضیح</label><input id="payNote"></div></div><div class="btnrow"><button class="btn">ثبت دریافت</button></div></form></div><div class="card"><div class="section-title"><h2>سوابق دریافت</h2></div><div class="tablewrap"><table><thead><tr><th>تاریخ</th><th>مشتری</th><th>مبلغ</th><th>روش</th><th>توضیح</th><th>عملیات</th></tr></thead><tbody>${db.payments.length?[...db.payments].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(customerName(p.customerId))}</td><td>${money(p.amount)}</td><td>${esc(p.method)}</td><td>${esc(p.note||'')}</td><td><button class="btn danger" onclick="deletePayment('${p.id}')">حذف</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">دریافتی ثبت نشده است.</td></tr>'}</tbody></table></div></div>`}
function savePayment(e){e.preventDefault();let x={id:uid(),date:$('#payDate').value,customerId:$('#payCustomer').value,amount:num($('#payAmount').value),method:$('#payMethod').value,note:$('#payNote').value.trim()};if(x.amount<=0){alert('مبلغ باید بیشتر از صفر باشد.');return}db.payments.push(x);save();render();alert('دریافت ثبت شد.')};function deletePayment(id){if(confirm('این دریافت حذف شود؟ مانده بدهی مشتری افزایش پیدا می‌کند.')){db.payments=db.payments.filter(p=>p.id!==id);save();render()}}function quickPay(id){go('payments');setTimeout(()=>{let s=$('#payCustomer');if(s)s.value=id},0)}
function expensesPage(){return `<div class="card"><div class="section-title"><h2>ثبت هزینه</h2></div><form onsubmit="saveExpense(event)"><div class="formgrid"><div><label>تاریخ</label><input id="eDate" type="date" value="${today()}" required></div><div><label>عنوان هزینه *</label><input id="eTitle" required placeholder="کرایه، سوخت، حقوق، بسته‌بندی..."></div><div><label>مبلغ (تومان)</label><input id="eAmount" type="number" min="1" required></div><div><label>روش پرداخت</label><select id="eMethod"><option>نقدی</option><option>کارت‌به‌کارت</option><option>کارت‌خوان</option><option>چک</option><option>دیگر</option></select></div><div><label>توضیحات</label><input id="eNote"></div></div><div class="btnrow"><button class="btn">ثبت هزینه</button></div></form></div><div class="card"><div class="section-title"><h2>فهرست هزینه‌ها</h2><span class="pill">جمع: ${money(db.expenses.reduce((a,x)=>a+num(x.amount),0))}</span></div><div class="tablewrap"><table><thead><tr><th>تاریخ</th><th>عنوان</th><th>مبلغ</th><th>روش</th><th>توضیح</th><th></th></tr></thead><tbody>${db.expenses.length?[...db.expenses].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.title)}</td><td>${money(x.amount)}</td><td>${esc(x.method)}</td><td>${esc(x.note||'')}</td><td><button class="btn danger" onclick="deleteExpense('${x.id}')">حذف</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">هزینه‌ای ثبت نشده است.</td></tr>'}</tbody></table></div></div>`}
function saveExpense(e){e.preventDefault();db.expenses.push({id:uid(),date:$('#eDate').value,title:$('#eTitle').value.trim(),amount:num($('#eAmount').value),method:$('#eMethod').value,note:$('#eNote').value.trim()});save();render()}function deleteExpense(id){if(confirm('هزینه حذف شود؟')){db.expenses=db.expenses.filter(x=>x.id!==id);save();render()}}
function reportsPage(){let from=$('#rFrom')?.value||today().slice(0,7)+'-01',to=$('#rTo')?.value||today();let sales=db.sales.filter(s=>s.date>=from&&s.date<=to),expenses=db.expenses.filter(e=>e.date>=from&&e.date<=to),payments=db.payments.filter(p=>p.date>=from&&p.date<=to);let rev=sales.reduce((a,s)=>a+num(s.total),0),cost=sales.reduce((a,s)=>{let p=db.products.find(p=>p.id===s.productId);return a+num(p?.cost)*num(s.qty)},0),exp=expenses.reduce((a,e)=>a+num(e.amount),0),paid=sales.reduce((a,s)=>a+num(s.paid),0)+payments.reduce((a,p)=>a+num(p.amount),0);return `<div class="card"><div class="section-title"><h2>گزارش بازه زمانی</h2></div><div class="formgrid"><div><label>از تاریخ</label><input id="rFrom" type="date" value="${from}" onchange="render()"></div><div><label>تا تاریخ</label><input id="rTo" type="date" value="${to}" onchange="render()"></div></div><div class="grid" style="margin-top:12px"><div class="card metric"><small>مجموع فاکتورها</small><strong>${money(rev)}</strong></div><div class="card metric"><small>دریافتی‌ها در فاکتورها و پرداخت‌ها</small><strong>${money(paid)}</strong></div><div class="card metric"><small>هزینه‌های ثبت‌شده</small><strong>${money(exp)}</strong></div><div class="card metric"><small>سود تقریبی کالاهای فروخته‌شده پس از هزینه‌ها</small><strong>${money(rev-cost-exp)}</strong></div></div><p class="muted">سود تقریبی است و فقط وقتی قابل اتکاست که قیمت خرید کالاها درست ثبت شده باشد؛ سایر هزینه‌ها و تخفیف‌ها ممکن است نیاز به بررسی داشته باشند.</p></div><div class="card"><h2 style="font-size:17px">خلاصه وضعیت</h2><p>تعداد فاکتورها: <b>${sales.length.toLocaleString('fa-IR')}</b></p><p>تعداد مشتریان: <b>${db.customers.length.toLocaleString('fa-IR')}</b></p><p>کل بدهی باز مشتریان: <b>${money(totalDebt())}</b></p><p>ارزش خرید موجودی فعلی: <b>${money(stockValue())}</b></p><p>تعداد خریدها: <b>${db.purchases.length.toLocaleString('fa-IR')}</b> · تعداد چک‌ها: <b>${db.checks.length.toLocaleString('fa-IR')}</b> · مرجوعی‌ها: <b>${db.returns.length.toLocaleString('fa-IR')}</b></p><p>مانده حساب تأمین‌کنندگان: <b>${money(db.suppliers.reduce((a,x)=>a+Math.max(0,supplierBalance(x.id)),0))}</b></p><div class="btnrow"><button class="btn secondary" onclick="exportCSV()">خروجی اکسل‌خوان فروش (CSV)</button><button class="btn secondary" onclick="window.print()">چاپ گزارش</button></div></div>`}

function suppliersPage(){return `<div class="card"><h2>ثبت تأمین‌کننده</h2><form onsubmit="saveSupplier(event)"><div class="formgrid"><div><label>نام تأمین‌کننده *</label><input id="supName" required></div><div><label>تلفن</label><input id="supPhone" inputmode="tel"></div><div><label>آدرس</label><input id="supAddress"></div><div><label>یادداشت</label><input id="supNote"></div></div><div class="btnrow"><button class="btn">ذخیره تأمین‌کننده</button></div></form></div><div class="card"><h2>فهرست تأمین‌کنندگان و مانده حساب</h2><div class="tablewrap"><table><thead><tr><th>نام</th><th>تلفن</th><th>مانده حساب</th><th>عملیات</th></tr></thead><tbody>${db.suppliers.length?db.suppliers.map(x=>`<tr><td>${esc(x.name)}<div class="muted">${esc(x.address||'')}</div></td><td>${esc(x.phone||'—')}</td><td>${money(supplierBalance(x.id))}</td><td><button class="btn danger" onclick="deleteSupplier('${x.id}')">حذف</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty">تأمین‌کننده‌ای ثبت نشده است.</td></tr>'}</tbody></table></div></div>`}

function savePurchase(e){e.preventDefault();let p=db.products.find(x=>x.id===$('#purProduct').value),qty=num($('#purQty').value),cost=num($('#purCost').value),total=qty*cost,paid=num($('#purPaid').value);if(!p)return alert('کالا را انتخاب کن.');if(paid>total)return alert('پرداخت نمی‌تواند از مبلغ خرید بیشتر باشد.');p.qty=num(p.qty)+qty;p.cost=cost;db.purchases.push({id:uid(),date:$('#purDate').value,supplierId:$('#purSupplier').value,productId:p.id,qty,cost,total,paid,invoice:$('#purInvoice').value.trim(),note:$('#purNote').value.trim()});save();render();alert('خرید ثبت شد و موجودی افزایش یافت.')}

function saveSupplierPay(e){e.preventDefault();db.supplierPayments.push({id:uid(),date:$('#spDate').value,supplierId:$('#spSupplier').value,amount:num($('#spAmount').value),method:$('#spMethod').value,note:$('#spNote').value.trim()});save();render();alert('پرداخت ثبت شد.')}
function checksPage(){let due=db.checks.filter(x=>x.status==='در انتظار'&&x.dueDate&&x.dueDate<=today());return `<div class="card"><h2>ثبت چک دریافتی یا پرداختی</h2><div class="notice ${due.length?'danger-note':''}">چک‌های در انتظار با سررسید امروز یا گذشته: ${due.length} مورد. این صفحه یادآوری داخل برنامه است و اعلان خودکار گوشی ارسال نمی‌کند.</div><form onsubmit="saveCheck(event)"><div class="formgrid"><div><label>نوع چک</label><select id="chType"><option value="دریافتی">دریافتی از مشتری</option><option value="پرداختی">پرداختی به تأمین‌کننده</option></select></div><div><label>طرف حساب</label><input id="chParty" placeholder="نام مشتری یا تأمین‌کننده"></div><div><label>مبلغ (تومان) *</label><input id="chAmount" type="number" min="1" required></div><div><label>تاریخ دریافت/صدور</label><input id="chDate" type="date" value="${today()}" required></div><div><label>تاریخ سررسید *</label><input id="chDue" type="date" required></div><div><label>شماره چک</label><input id="chNumber"></div><div><label>بانک</label><input id="chBank"></div><div><label>وضعیت</label><select id="chStatus"><option>در انتظار</option><option>وصول شد</option><option>پرداخت شد</option><option>برگشت خورد</option><option>باطل شد</option></select></div><div><label>توضیح</label><input id="chNote"></div></div><div class="btnrow"><button class="btn">ثبت چک</button></div></form></div><div class="card"><h2>فهرست چک‌ها</h2><div class="tablewrap"><table><thead><tr><th>نوع / طرف حساب</th><th>شماره / بانک</th><th>مبلغ</th><th>سررسید</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>${db.checks.length?[...db.checks].sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||'')).map(x=>`<tr><td>${esc(x.type)}<div class="muted">${esc(x.party||'—')}</div></td><td>${esc(x.number||'—')}<div class="muted">${esc(x.bank||'')}</div></td><td>${money(x.amount)}</td><td><span class="pill ${x.status==='در انتظار'&&x.dueDate<=today()?'red':''}">${esc(x.dueDate)}</span></td><td><select onchange="updateCheckStatus('${x.id}',this.value)">${['در انتظار','وصول شد','پرداخت شد','برگشت خورد','باطل شد'].map(st=>`<option ${x.status===st?'selected':''}>${st}</option>`).join('')}</select></td><td><button class="btn danger" onclick="deleteCheck('${x.id}')">حذف</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">چکی ثبت نشده است.</td></tr>'}</tbody></table></div></div>`}
function saveCheck(e){e.preventDefault();db.checks.push({id:uid(),type:$('#chType').value,party:$('#chParty').value.trim(),amount:num($('#chAmount').value),date:$('#chDate').value,dueDate:$('#chDue').value,number:$('#chNumber').value.trim(),bank:$('#chBank').value.trim(),status:$('#chStatus').value,note:$('#chNote').value.trim()});save();render()}
function updateCheckStatus(id,status){let x=db.checks.find(x=>x.id===id);if(x){x.status=status;save();render()}}function deleteCheck(id){if(confirm('این چک حذف شود؟')){db.checks=db.checks.filter(x=>x.id!==id);save();render()}}
function returnsPage(){return `<div class="card"><h2>ثبت مرجوعی کالا</h2><div class="notice">مرجوعی مشتری موجودی را زیاد می‌کند؛ مرجوعی به تأمین‌کننده موجودی را کم می‌کند. مبلغ مرجوعی را برای بررسی حساب ثبت کن؛ این صفحه به‌صورت خودکار پول نقد یا بدهی را تسویه نمی‌کند.</div><form onsubmit="saveReturn(event)"><div class="formgrid"><div><label>نوع مرجوعی</label><select id="retType"><option value="از مشتری">برگشت از مشتری</option><option value="به تأمین‌کننده">برگشت به تأمین‌کننده</option></select></div><div><label>تاریخ</label><input id="retDate" type="date" value="${today()}" required></div><div><label>طرف حساب</label><input id="retParty" placeholder="نام مشتری یا تأمین‌کننده"></div><div><label>کالا *</label><select id="retProduct" required><option value="">انتخاب کالا</option>${db.products.map(x=>`<option value="${x.id}">${esc(x.name)} (موجودی ${num(x.qty)})</option>`).join('')}</select></div><div><label>تعداد *</label><input id="retQty" type="number" min="0.01" step="0.01" required></div><div><label>مبلغ (تومان)</label><input id="retAmount" type="number" min="0" value="0"></div><div><label>علت مرجوعی</label><input id="retReason"></div></div><div class="btnrow"><button class="btn">ثبت مرجوعی</button></div></form></div><div class="card"><h2>سوابق مرجوعی</h2><div class="tablewrap"><table><thead><tr><th>تاریخ</th><th>نوع / طرف حساب</th><th>کالا</th><th>تعداد</th><th>مبلغ</th><th>علت</th></tr></thead><tbody>${db.returns.length?[...db.returns].reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.type)}<div class="muted">${esc(x.party||'—')}</div></td><td>${esc(productName(x.productId))}</td><td>${num(x.qty)}</td><td>${money(x.amount)}</td><td>${esc(x.reason||'')}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">مرجوعی ثبت نشده است.</td></tr>'}</tbody></table></div></div>`}
function saveReturn(e){e.preventDefault();let p=db.products.find(x=>x.id===$('#retProduct').value),qty=num($('#retQty').value),type=$('#retType').value;if(!p)return alert('کالا را انتخاب کن.');if(type==='به تأمین‌کننده'&&qty>num(p.qty))return alert('موجودی برای این مرجوعی کافی نیست.');p.qty=num(p.qty)+(type==='از مشتری'?qty:-qty);db.returns.push({id:uid(),type,date:$('#retDate').value,party:$('#retParty').value.trim(),productId:p.id,qty,amount:num($('#retAmount').value),reason:$('#retReason').value.trim()});save();render();alert('مرجوعی ثبت شد و موجودی به‌روزرسانی شد.')}
function deliveriesPage(){return `<div class="card"><h2>مدیریت سفارش و ارسال پخش</h2><form onsubmit="saveDelivery(event)"><div class="formgrid"><div><label>تاریخ سفارش</label><input id="delDate" type="date" value="${today()}" required></div><div><label>مشتری</label><select id="delCustomer"><option value="">مشتری متفرقه</option>${db.customers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div><label>آدرس ارسال</label><input id="delAddress"></div><div><label>نام راننده</label><input id="delDriver"></div><div><label>هزینه ارسال (تومان)</label><input id="delFee" type="number" min="0" value="0"></div><div><label>وضعیت سفارش</label><select id="delStatus"><option>ثبت سفارش</option><option>آماده‌سازی</option><option>ارسال شد</option><option>تحویل شد</option><option>لغو شد</option></select></div><div><label>شماره فاکتور / سفارش</label><input id="delInvoice"></div><div><label>یادداشت</label><input id="delNote"></div></div><div class="btnrow"><button class="btn">ثبت سفارش ارسال</button></div></form></div><div class="card"><h2>سفارش‌های پخش</h2><div class="tablewrap"><table><thead><tr><th>تاریخ / شماره</th><th>مشتری</th><th>آدرس</th><th>راننده</th><th>هزینه</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>${db.deliveries.length?[...db.deliveries].reverse().map(x=>`<tr><td>${esc(x.date)}<div class="muted">${esc(x.invoice||'—')}</div></td><td>${esc(customerName(x.customerId))}</td><td>${esc(x.address||'')}</td><td>${esc(x.driver||'')}</td><td>${money(x.fee)}</td><td><select onchange="updateDelivery('${x.id}',this.value)">${['ثبت سفارش','آماده‌سازی','ارسال شد','تحویل شد','لغو شد'].map(st=>`<option ${x.status===st?'selected':''}>${st}</option>`).join('')}</select></td><td><button class="btn danger" onclick="deleteDelivery('${x.id}')">حذف</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">سفارشی ثبت نشده است.</td></tr>'}</tbody></table></div></div>`}
function saveDelivery(e){e.preventDefault();db.deliveries.push({id:uid(),date:$('#delDate').value,customerId:$('#delCustomer').value,address:$('#delAddress').value.trim(),driver:$('#delDriver').value.trim(),fee:num($('#delFee').value),status:$('#delStatus').value,invoice:$('#delInvoice').value.trim(),note:$('#delNote').value.trim()});save();render()}
function updateDelivery(id,status){let x=db.deliveries.find(x=>x.id===id);if(x){x.status=status;save();render()}}function deleteDelivery(id){if(confirm('سفارش حذف شود؟')){db.deliveries=db.deliveries.filter(x=>x.id!==id);save();render()}}
function backupPage(){return `<div class="card"><div class="section-title"><h2>پشتیبان‌گیری و بازیابی</h2></div><div class="notice danger-note">خیلی مهم: اطلاعات این برنامه فعلاً در همین مرورگر گوشی ذخیره می‌شود؛ اگر گوشی عوض شود یا داده‌های مرورگر پاک شود، ممکن است اطلاعات از بین برود. فایل پشتیبان را مرتب ذخیره کن.</div><div class="btnrow"><button class="btn" onclick="backup()">دانلود نسخه پشتیبان</button><label class="btn secondary" for="restoreFile" style="margin:0;cursor:pointer">بازیابی نسخه پشتیبان</label><input id="restoreFile" class="hidden" type="file" accept="application/json,.json" onchange="restore(event)"><button class="btn blue" onclick="exportCSV()">خروجی فروش CSV</button></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>تنظیمات فاکتور</h3><form onsubmit="saveSettings(event)"><label>نام کسب‌وکار</label><input id="setBusiness" value="${esc(db.settings.business||'الوین پخش')}"><label>تلفن</label><input id="setPhone" value="${esc(db.settings.phone||'')}"><label>آدرس</label><input id="setAddress" value="${esc(db.settings.address||'')}"><div class="btnrow"><button class="btn">ذخیره تنظیمات</button></div></form><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>پاک‌کردن همه اطلاعات</h3><p class="muted">فقط اگر مطمئنی و نسخه پشتیبان داری، استفاده کن.</p><button class="btn danger" onclick="resetAll()">حذف کامل اطلاعات برنامه</button></div>`}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='alvin-pakhsh-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.products)||!Array.isArray(x.sales))throw Error();if(!confirm('اطلاعات فعلی با اطلاعات فایل پشتیبان جایگزین شود؟ اول یک نسخه از اطلاعات فعلی دانلود کن.'))return;db={...emptyDB(),...x};save();render();alert('بازیابی انجام شد.')}catch(err){alert('فایل پشتیبان معتبر نیست.')}e.target.value=''};r.readAsText(f)}function saveSettings(e){e.preventDefault();db.settings={business:$('#setBusiness').value.trim()||'الوین پخش',phone:$('#setPhone').value.trim(),address:$('#setAddress').value.trim()};save();render();alert('تنظیمات ذخیره شد.')}function resetAll(){if(prompt('برای تأیید، عبارت حذف کامل را بنویس:')==='حذف کامل'){db=emptyDB();save();render();alert('اطلاعات برنامه پاک شد.')}}
function exportCSV(){let rows=[['شماره فاکتور','تاریخ','مشتری','کالا','تعداد','قیمت واحد','تخفیف','مبلغ کل','دریافتی هنگام فروش','مانده','روش دریافت','توضیحات'],...db.sales.map(s=>[s.invoice,s.date,customerName(s.customerId),productName(s.productId),s.qty,s.price,s.discount,s.total,s.paid,Math.max(0,s.total-s.paid),s.method,s.note||''])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='alvin-pakhsh-sales-'+today()+'.csv';a.click();URL.revokeObjectURL(a.href)}
render();
</script></body></html>
